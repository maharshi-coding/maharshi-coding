<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="356" viewBox="0 0 1200 356" role="img" aria-label="MAHARSHI.EXE Neon Void game boot screen in ultraviolet and ice blue">
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b21"/><stop offset=".52" stop-color="#151334"/><stop offset="1" stop-color="#080e27"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bda2ff"/><stop offset=".52" stop-color="#7ee7ff"/><stop offset="1" stop-color="#ff91c5"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f9f9ff"/><stop offset="1" stop-color="#bca8ff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#947bff" stop-opacity=".35"/><stop offset="1" stop-color="#947bff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#57518b" stroke-opacity=".20" stroke-width=".9"/></pattern>
  <style><![CDATA[
    .mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .orbit{animation:spin 19s linear infinite;transform-origin:1000px 177px}
    .orbitB{animation:spin 28s linear reverse infinite;transform-origin:1000px 177px}
    .cursor{animation:blink 1.1s steps(1) infinite}
    .bootA{animation:showA 8s steps(1) infinite}
    .bootB{animation:showB 8s steps(1) infinite}
    .bootC{animation:showC 8s steps(1) infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.37}}
    @keyframes blink{50%{opacity:0}}@keyframes showA{0%{opacity:0}12%,100%{opacity:1}}
    @keyframes showB{0%,24%{opacity:0}27%,100%{opacity:1}}@keyframes showC{0%,44%{opacity:0}47%,100%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.orbit,.orbitB,.pulse,.cursor,.bootA,.bootB,.bootC{animation:none}}
  ]]></style>
</defs>
<rect x="0" y="0" width="1200" height="356" rx="18" fill="url(#base)"/>
<rect x="0" y="0" width="1200" height="356" rx="18" fill="url(#grid)"/>
<circle cx="999" cy="170" r="236" fill="url(#halo)"/>
<path d="M0 4H1200" stroke="url(#neon)" stroke-width="5"/>
<path d="M25 24H1175V332H25Z" stroke="#5f568d" stroke-opacity=".8" stroke-width="1.4" fill="none"/>
<path d="M25 62H1175" stroke="#5b528c" stroke-opacity=".65" stroke-width="1.1"/>
<circle cx="47" cy="42" r="5" fill="#ff92c0"/><circle cx="66" cy="42" r="5" fill="#c4aaff"/><circle cx="85" cy="42" r="5" fill="#7ee7ff"/>
<text class="mono" x="109" y="48" font-size="15" font-weight="700" letter-spacing="2.7" fill="#c5b2ff">M A H A R S H I . E X E</text>
<text class="mono" x="728" y="47" font-size="12" letter-spacing="1.4" fill="#98aad5">PLAYER ONE / NEW GAME+ / NEON VOID</text>
<g class="mono" font-size="15" fill="#b7c6eb">
<text class="bootA" x="51" y="99">[OK] LOADING ENGINEERING QUESTS ....... 100%</text>
<text class="bootB" x="51" y="127">[OK] CONNECTING TO UPSTREAM GUILDS ... 100%</text>
<text class="bootC" x="51" y="155">[OK] SUMMONING AI SYSTEMS ............ 100%</text>
</g>
<rect x="47" y="176" width="520" height="2" fill="url(#neon)" opacity=".75"/>
<text x="46" y="239" font-family="Arial,'Segoe UI',sans-serif" font-size="60" font-weight="900" letter-spacing="1.6" fill="url(#title)">MAHARSHI</text>
<text x="49" y="288" class="mono" font-size="43" font-weight="800" letter-spacing="4.5" fill="#83edff">RPG // DEV</text>
<text x="51" y="318" class="mono" font-size="14" fill="#b5bbdd">CLASS: FULL-STACK MAGE / AI SUMMONER</text>
<rect class="cursor" x="414" y="304" width="10" height="15" fill="#eaa1ff"/>
<g class="orbit"><circle cx="1000" cy="177" r="130" fill="none" stroke="#b79bff" stroke-width="2" stroke-dasharray="18 12"/><path d="M1000 45V309M868 177H1132" stroke="#6862b7" stroke-opacity=".6"/><circle cx="1000" cy="47" r="7" fill="#ff93cc"/></g>
<g class="orbitB"><ellipse cx="1000" cy="177" rx="158" ry="57" transform="rotate(-27 1000 177)" stroke="#6fe5ff" stroke-width="2" fill="none"/><circle cx="851" cy="177" r="6" fill="#7fe7ff"/></g>
<circle cx="1000" cy="177" r="88" fill="#111530" stroke="#9c89ff" stroke-width="2.5"/>
<circle class="pulse" cx="1000" cy="177" r="76" fill="none" stroke="#78dfff" stroke-dasharray="3 9" stroke-width="2"/>
<path d="M956 132L979 117H1021L1044 132V223L1021 237H979L956 223Z" fill="#302856" stroke="#c1a7ff" stroke-width="2"/>
<text x="1000" y="191" font-family="Arial,sans-serif" font-size="50" font-weight="900" text-anchor="middle" fill="#e8dcff">MB</text>
<path d="M823 285L852 315H1110L1140 285" fill="none" stroke="#866dd3" stroke-width="2"/>
<text x="994" y="332" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#a6b1d6">PRESS START // EXPLORE THE SYSTEM</text>
</svg>
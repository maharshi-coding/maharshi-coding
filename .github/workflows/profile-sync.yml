name: Refresh GitHub portfolio data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate_profile.py'
      - '.github/workflows/profile-sync.yml'
      - 'docs/index.html'
      - 'docs/assets/**'
  schedule:
    - cron: '13 */8 * * *'

permissions:
  contents: write

concurrency:
  group: portfolio-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'maharshi-coding/maharshi-coding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main
            python -m py_compile scripts/generate_profile.py
            python scripts/generate_profile.py
            python -m json.tool docs/data/profile.json > /dev/null
            if git diff --quiet -- README.md docs/data/profile.json; then
              echo "Portfolio data already up to date"
              exit 0
            fi
            git add README.md docs/data/profile.json
            git commit -m "docs: refresh public GitHub projects and PR status"
            if git push origin HEAD:main; then
              echo "Portfolio data refreshed"
              exit 0
            fi
          done
          echo "Could not commit data after four retries" >&2
          exit 1

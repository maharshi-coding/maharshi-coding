name: Sync RPG profile data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate_profile.py'
      - '.github/workflows/profile-rpg-sync.yml'
      - 'docs/index.html'
  schedule:
    - cron: '13 */8 * * *'

permissions:
  contents: write

concurrency:
  group: rpg-profile-refresh
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'maharshi-coding/maharshi-coding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate from latest main and safely publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always regenerate against the *latest* README. This avoids merge
          # conflicts if someone redesigns static sections while the job runs.
          for attempt in 1 2 3 4; do
            echo "RPG profile sync attempt $attempt"
            git fetch origin main
            git checkout -B main origin/main

            python -m py_compile scripts/generate_profile.py
            python scripts/generate_profile.py
            python -m json.tool docs/data/profile.json > /dev/null

            if git diff --quiet -- README.md docs/data/profile.json; then
              echo "Profile already up to date"
              exit 0
            fi

            git add README.md docs/data/profile.json
            git commit -m "chore(profile): sync public GitHub quests and achievements"
            if git push origin HEAD:main; then
              echo "GitHub profile synced successfully"
              exit 0
            fi
            echo "Remote changed during API fetch; refreshing against current main"
          done
          echo "GitHub profile sync failed after four safe retries" >&2
          exit 1

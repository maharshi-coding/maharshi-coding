name: RPG console quality gate
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/rpg-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generator syntax and snapshot shape
        run: |
          python -m py_compile scripts/generate_profile.py
          python -m json.tool docs/data/profile.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('docs/data/profile.json').read_text())
          assert p['username'] == 'maharshi-coding'
          assert isinstance(p['repos'], list)
          assert set(p['prs']) == {'merged', 'open'}
          assert all(r['url'].startswith('https://github.com/') for r in p['repos'])
          assert all(not r.get('private', False) for r in p['repos'])
          for state in ('merged', 'open'):
              assert all('/pull/' in r['url'] and r['state'] == state for r in p['prs'][state])
          readme = Path('README.md').read_text()
          for marker in ('prs','projects','hud'):
              assert '<!--START_SECTION:'+marker+'-->' in readme
              assert '<!--END_SECTION:'+marker+'-->' in readme
          assert Path('docs/index.html').exists()
          print('RPG profile static checks passed')
          PY
